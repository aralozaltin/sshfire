[package]
name = "vcore"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
keyring = "4.2.0"
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
uuid = "1.28.0"
