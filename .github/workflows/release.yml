name: Release

# Pushing a tag such as v0.2.0 builds installers for every platform, signs the update
# packages and publishes a GitHub release together with latest.json for the in-app updater.
on:
  push:
    tags:
      - "v*"
  # Re-run the stable download names for an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.3"
        required: true

jobs:
  build:
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Each job merges its platforms into latest.json; parallel jobs overwrite each other.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SSHFire ${{ github.ref_name }}"
          releaseBody: |
            ## Which file do I need?

            | Your system | Download |
            |---|---|
            | **macOS**, Apple Silicon (M1 or newer) | [SSHFire-macOS-AppleSilicon.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-macOS-AppleSilicon.dmg) |
            | **macOS**, Intel | [SSHFire-macOS-Intel.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-macOS-Intel.dmg) |
            | **Windows** 10/11 | [SSHFire-Windows-x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-Windows-x64-setup.exe) |
            | **Linux** | [SSHFire-x86_64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-x86_64.AppImage) (runs on any distribution) |

            Other formats: [Ubuntu / Debian .deb](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-Linux-x64.deb), [Fedora / RHEL .rpm](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-Linux-x64.rpm), [Windows .msi for IT deployment](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SSHFire-Windows-x64.msi).

            The remaining files in the list below (`.sig`, `.tar.gz`, `.json`) are used by the in-app updater. You do not need them.

            On first launch your system may ask you to confirm the app: on macOS open *System Settings → Privacy & Security → Open Anyway*; on Windows choose *More info → Run anyway* in SmartScreen. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  stable-names:
    name: Stable download names
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Copy the installers to names without a version
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir dl src
          copy() {
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$1" --dir dl
            mv "dl/$1" "dl/$2"
          }
          copy "SSHFire_${ver}_aarch64.dmg" SSHFire-macOS-AppleSilicon.dmg
          copy "SSHFire_${ver}_x64.dmg" SSHFire-macOS-Intel.dmg
          copy "SSHFire_${ver}_x64-setup.exe" SSHFire-Windows-x64-setup.exe
          copy "SSHFire_${ver}_x64_en-US.msi" SSHFire-Windows-x64.msi
          copy "SSHFire_${ver}_amd64.deb" SSHFire-Linux-x64.deb
          copy "SSHFire-${ver}-1.x86_64.rpm" SSHFire-Linux-x64.rpm
          # The AppImage gets embedded update information and a .zsync file so that
          # AppImageUpdate can fetch only the changed blocks.
          sudo apt-get update
          sudo apt-get install -y zsync
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "SSHFire_${ver}_amd64.AppImage" --dir src
          chmod +x "src/SSHFire_${ver}_amd64.AppImage"
          (cd src && "./SSHFire_${ver}_amd64.AppImage" --appimage-extract >/dev/null)
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          (cd dl && ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ../appimagetool --no-appstream \
            -u "gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|SSHFire-x86_64.AppImage.zsync" \
            ../src/squashfs-root SSHFire-x86_64.AppImage)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dl/*

  cask:
    name: Update the Homebrew cask
    needs: stable-names
    if: needs.stable-names.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the cask for this release and commit it
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          scripts/update-cask.sh "$ver"
          if git diff --quiet Casks/sshfire.rb; then
            echo "Cask already at $ver"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sshfire.rb
          git commit -m "chore: update the Homebrew cask to $ver"
          git push origin HEAD:main
