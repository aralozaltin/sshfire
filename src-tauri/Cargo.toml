[package]
name = "ssh-istemci"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssh_istemci_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vcore = { path = "../vcore" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "rt"] }
async-trait = "0.1.92"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
portable-pty = "0.9.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-notification = "2.7.0"

[dev-dependencies]
tempfile = "3.27.0"
